<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Família 21: blackjack roguelike no estilo Balatro, com multiplayer para até 10 pessoas.">
<title>Família 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen portrait card table — HUD, rival strip (multiplayer), joker rack, dealer, message rail, player, action bar. Deliberately single dark casino-felt world. */
:root{
  --felt:#0f3d34; --felt-deep:#071c19;
  --panel:#10231f; --panel-2:#1a3a34; --edge:#050f0d;
  --ink:#fbf4e2; --ink-dim:#bcd6cb;
  --chips:#2b86f0; --mult:#f0453a; --gold:#f5bd3a; --violet:#8a52d6; --orange:#e8822a;
  --card:#fbf6ea; --card-ink:#17161c; --card-red:#cc2a25; --card-back:#b5323f;
  --font:"Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-px:"Pixelify Sans", "Rubik", system-ui, sans-serif;
  --cw:clamp(48px,15vw,66px); --ch:calc(var(--cw)*1.4);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
body{background:var(--felt-deep);color:var(--ink);font-family:var(--font);font-size:15px;font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.55) 100%)}
#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;overflow-x:hidden}
button,input{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;line-height:1;font-weight:800}

/* HUD */
.hud{display:grid;grid-template-columns:1.25fr 1fr;gap:7px}
.blind,.score,.calc,.stat{background:var(--panel);border:2px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--edge)}
.blind{padding:6px 10px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;min-width:0}
.blind::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--bc,var(--chips))}
.blind .bn{font-weight:800;font-size:15px;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blind .bt{font-size:12px;font-weight:600;color:var(--ink-dim);padding-left:4px;display:flex;gap:6px;align-items:baseline}
.blind .bt .num{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:24px;color:#ff6b61}
.blind .bt .rw{margin-left:auto;color:var(--gold);font-weight:800;font-size:15px}
.blind .bt .of{font-size:13px;font-weight:700;color:var(--ink-dim);margin-left:-4px}
.blind .bt .rw[title]{color:#ff8077}
.score{padding:6px 10px;display:flex;flex-direction:column;justify-content:center}
.score .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.score .num{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:31px}
.score .num.hpnum{color:#ff6b61}
.score .num .of{font-size:15px;color:var(--ink-dim);margin-left:3px}
.bar{height:6px;border-radius:3px;background:var(--edge);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}

.calc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:6px 8px;cursor:pointer}
.calc .hn{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:800}
.calc .hn small{color:var(--ink-dim);font-weight:600;font-size:12px}
.calc .hn .tot{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:22px;color:var(--gold)}
.pill{border-radius:8px;padding:3px 9px;font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;font-size:27px;line-height:1.05;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.pill.c{background:var(--chips);text-align:right}
.pill.m{background:var(--mult);text-align:left}
.calc .x{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:26px;color:#ff6b61}
.calc.lose .pill{filter:grayscale(1) brightness(.6)}
.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.14)}}

.stats{display:flex;gap:6px}
.stat{flex:1;min-width:0;padding:4px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--edge)}
.stat small{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim)}
.stat .num{font-size:19px}
.stat.h .num{color:#6fb0ff} .stat.s .num{color:#ff7a70} .stat.mo .num{color:var(--gold)}
.stat.menu{flex:0 0 54px;cursor:pointer;justify-content:center;background:var(--gold);color:#2a1b00;border-color:var(--edge);box-shadow:0 3px 0 var(--edge);gap:1px}
.stat.menu .pz{font-size:17px;font-weight:800;line-height:1;letter-spacing:-1px}
.stat.menu small{color:#2a1b00;font-size:10px;font-weight:800}
.stat.menu:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
body.menu #app{visibility:hidden}
body.menu #sheet{background:rgba(3,10,9,.35)}

/* Rival strip */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;cursor:pointer;padding-bottom:2px;flex:0 0 auto}
.strip::-webkit-scrollbar{display:none}
.rv{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px;font-weight:800;white-space:nowrap}
.rv.me{border-color:var(--gold)}
.rv.out{opacity:.45}
.dot{width:20px;height:20px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:11px;font-weight:800;color:#111;flex:0 0 auto}
.rv .hearts{color:#ff6b61;letter-spacing:-.5px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.rv .where{color:var(--ink-dim);font-weight:600}

/* Joker rack */
.rack{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.joker,.slot{height:76px;border-radius:9px;box-sizing:border-box;min-width:0}
.slot{border:2px dashed rgba(251,244,226,.18)}
.joker{border:2px solid var(--edge);background:linear-gradient(160deg,color-mix(in srgb,var(--jc) 88%,#fff),var(--jc));box-shadow:0 3px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;cursor:pointer;position:relative;overflow:hidden}
.joker::after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.28);border-radius:6px;pointer-events:none}
.joker .jg{font-size:24px;font-weight:800;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.joker .jn{font-size:11px;line-height:1.1;text-align:center;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.joker .jv{position:absolute;top:4px;right:6px;font-size:12px;font-weight:800}
.wiggle{animation:wig .32s}
@keyframes wig{25%{transform:rotate(-7deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}

/* Table */
.table{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;background:radial-gradient(ellipse at 50% 0%,#17574a,var(--felt) 70%);border:2px solid var(--edge);border-radius:18px 18px 60px 60px;padding:8px 8px 10px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 3px 0 var(--edge)}
.side{display:flex;flex-direction:column;align-items:center;gap:4px}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.tag b{font-size:18px;font-weight:800;color:var(--ink);background:rgba(0,0,0,.4);border-radius:6px;padding:2px 8px;min-width:22px;text-align:center;letter-spacing:0;font-variant-numeric:tabular-nums}
.tag b.bust{color:#ff6b61} .tag b.hot{color:var(--gold)}
.cards{display:flex;justify-content:center;min-height:var(--ch);padding-top:8px}
.card{width:var(--cw);height:var(--ch);background:var(--card);color:var(--card-ink);border-radius:7px;box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.15);position:relative;flex:0 0 auto;transition:transform .15s}
.card + .card{margin-left:calc(var(--cw)*-.22)}
.cards.tight .card + .card{margin-left:calc(var(--cw)*-.46)}
.card.red{color:var(--card-red)}
.card .tl{position:absolute;top:4px;left:5px;font-weight:800;font-size:calc(var(--cw)*.32);line-height:.95;text-align:center}
.card .tl i{display:block;font-style:normal;font-size:.78em}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.55);padding-top:16%}
.card.back{background:repeating-linear-gradient(45deg,var(--card-back) 0 5px,#93222f 5px 10px);border:3px solid var(--card)}
.card.peek{outline:2px dashed var(--violet);outline-offset:-5px}
.player .card{cursor:pointer}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--violet),0 6px 0 rgba(0,0,0,.4)}
.card.lit{transform:translateY(-8px) scale(1.06)}
.deal{animation:deal .48s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes deal{from{transform:translate(120px,-140px) rotate(30deg);opacity:0}}
.msg{text-align:center;font-size:14px;font-weight:700;min-height:22px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.msg.rail{color:rgba(251,244,226,.42);letter-spacing:.12em;font-size:11px;text-transform:uppercase}

/* Actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-bottom:4px}
.actions.one{grid-template-columns:1fr}
.btn{border:0;border-radius:10px;padding:12px 4px 10px;font-size:16px;font-weight:800;background:var(--b,var(--chips));color:#fff;box-shadow:0 4px 0 var(--edge);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn small{font-size:11px;font-weight:600;opacity:.92}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.32;cursor:default}
.b-hit{--b:var(--chips)} .b-stand{--b:var(--orange)} .b-dbl{--b:var(--mult)} .b-swap{--b:var(--violet)} .b-go{--b:var(--gold);color:#2a1b00;text-shadow:none} .b-dim{--b:#2f5249}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:17px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap;animation:pop 1.15s ease-out forwards;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pop.chips{background:var(--chips)} .pop.mult{background:var(--mult)} .pop.gold{background:var(--gold);color:#2a1b00} .pop.info{background:var(--violet)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(3,10,9,.74);display:flex;align-items:center;justify-content:center;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--panel-2);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}

.panel > *{flex-shrink:0}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.panel h2{margin:0;font-size:22px;font-weight:800;text-align:center;text-wrap:balance}
.panel p{margin:0;line-height:1.45;color:var(--ink-dim);font-size:14.5px}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.logo .l1{font-family:var(--font-px);font-size:52px;line-height:.9;color:var(--ink);text-shadow:3px 3px 0 var(--mult),6px 6px 0 var(--edge)}
.logo .l2{font-family:var(--font);font-weight:800;font-size:92px;line-height:.9;letter-spacing:-.02em;color:var(--gold);text-shadow:4px 4px 0 var(--edge);animation:float 2.4s ease-in-out infinite}
.logo .l3{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:14.5px}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .num{font-size:20px}
.li.me{box-shadow:inset 0 0 0 2px var(--gold)}
.li.out{opacity:.5}
.c-chips{color:#7cb8ff} .c-mult{color:#ff8077} .c-gold{color:var(--gold)} .c-dim{color:var(--ink-dim)}
.blinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcard{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.bcard.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.bcard.done{opacity:.45}
.chip{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;border:4px dashed rgba(255,255,255,.55);background:var(--bc)}
.bcard .num{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:22px;color:#ff6b61}
.bcard .num.small{font-family:var(--font);font-size:13px;line-height:1.2}
.bcard small{font-size:11.5px;font-weight:600;color:var(--ink-dim);line-height:1.25}
.boss-note{background:color-mix(in srgb,var(--mult) 22%,var(--panel-2));border:2px solid var(--mult);border-radius:10px;padding:10px;text-align:center;font-size:14.5px;line-height:1.4}
.boss-note b{display:block;font-size:17px;margin-bottom:2px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.item .art{width:62px;height:76px;border-radius:8px;display:grid;place-items:center;font-size:26px;font-weight:800;border:2px solid var(--edge);background:var(--jc);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.item .art.planet{background:radial-gradient(circle at 35% 35%,#ffffff55,transparent 45%),var(--jc);border-radius:50%;width:66px;height:66px}
.item b{font-size:14.5px;font-weight:800}
.item small{font-size:12.5px;font-weight:500;color:var(--ink-dim);line-height:1.3;min-height:2.6em}
.item .btn{width:100%;padding:8px 4px;font-size:15px}
.item.sold{opacity:.35}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:600}
.kv .num{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:24px;color:var(--gold)}
hr{border:0;border-top:2px dashed rgba(251,244,226,.14);margin:0;width:100%}
.how p{color:var(--ink);font-size:14.5px}
.how b{color:var(--gold)}
.best{font-size:12.5px;font-weight:600;color:var(--ink-dim);text-align:center}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.field input{background:var(--edge);border:2px solid var(--panel-2);border-radius:9px;padding:11px 12px;font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:none;-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--pc);cursor:pointer;padding:0}
.colors button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--edge)}
.code{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;font-size:46px;text-align:center;letter-spacing:.14em;color:var(--gold);line-height:1;-webkit-user-select:text;user-select:text}
.note{font-size:13.5px;font-weight:600;color:var(--ink);background:var(--panel-2);padding:10px;border-radius:8px;line-height:1.4;-webkit-user-select:text;user-select:text}
.rv.off{border-style:dashed}
.net{font-size:12px;font-weight:700;text-align:center;color:#5fd38a}
.net.bad{color:#ff8077}
.cards.riv{display:block;width:100%;min-height:0;padding-top:2px}
.rivals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:100%}
.rivals.few{grid-template-columns:repeat(2,minmax(0,1fr))}
.rvl{position:relative;background:rgba(0,0,0,.34);border-radius:8px;padding:4px 7px 8px;font-size:12px;line-height:1.15;font-weight:700;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--ink);overflow:hidden}
.rvl .top{display:flex;align-items:center;gap:5px;min-width:0}
.rvl .dot{width:10px;height:10px;flex:0 0 auto}
.rvl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.rvl .hp{color:#ff7a70;font-variant-numeric:tabular-nums;font-size:18px;font-weight:800;line-height:1.05}
.rvl .hp small{font-size:9.5px;font-weight:800;margin-left:1px;color:#ff9a92}
.rvl .hpbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}
.rvl .hpbar i{display:block;height:100%;background:#ff6b61}
.rvl .tg{min-width:18px;text-align:center;border-radius:5px;padding:0 4px;background:rgba(255,255,255,.1);color:var(--ink-dim);font-weight:800;font-size:11.5px;flex:0 0 auto}
.rvl .tg.ready{color:#5fd38a}
.rvl .tg.shown{color:var(--gold)}
.rvl .tg.is21{color:#0b2a1c;background:#5fd38a;box-shadow:0 0 10px rgba(95,211,138,.8)}
.rvl .tg.bust{color:#ff8077}
.rvl.out{opacity:.4}
.mini{font-weight:800;color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mini .r{color:#ff8077}
.kind{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:1px 7px}
.kind.atk{background:color-mix(in srgb,var(--mult) 30%,transparent);color:#ff8f86}
.mesa-fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(109,74,149,.6),rgba(3,10,9,.78) 70%);animation:mfIn .3s ease-out both;z-index:40}
.mesa-fx.out{animation:mfOut .45s ease-in forwards}
.mf-box{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:280px;padding:0 16px}

    const a=audio();if(a.state==='suspended')a.resume();

    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    g.connect(lp).connect(a.destination);MUSIC.out=g;
    if(!MUSIC.noise){const nb=a.createBuffer(1,a.sampleRate*0.05,a.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUSIC.noise=nb}
    MUSIC.on=true;MUSIC.next=a.currentTime+0.15;MUSIC.timer=setInterval(musicSched,90);
  }catch(e){MUSIC.on=false}
}
function musicStop(){clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.on=false;try{MUSIC.out&&MUSIC.out.disconnect()}catch(e){}MUSIC.out=null}
function setMusicVol(v){

}
function mNote(t,f,dur,type,vol,att){
  const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(MUSIC.out);o.start(t);o.stop(t+dur+.05);
}
function musicSched(){
  if(!MUSIC.on||!AC||!MUSIC.out)return;
  const e8=60/78/2;
  while(MUSIC.next<AC.currentTime+0.4){
    const t=MUSIC.next,st=MUSIC.step%32,ch=PROG[Math.floor(st/8)],i=st%8;
    const sw=i%2?e8*0.18:0;
    if(i===0)for(const m of ch.p){mNote(t,mtof(m),e8*7.5,'triangle',0.05,0.35);mNote(t,mtof(m)*1.003,e8*7.5,'sine',0.03,0.5)}
    if(i===0||i===3||i===4||i===6){const off=i===4?7:i===6?12:i===3?(st%16<8?3:5):0;mNote(t+sw,mtof(ch.b+off),e8*1.6,'triangle',0.16,0.02)}

  }
}

async function deal(){

async function afterDraw(){
  const p=total(S.player);
  if(p===21&&capNow()===21){if(S.player.length===2){S.msg='Blackjack!';render();fxBlackjack();await sleep(1200)}else{S.msg='Chegou a 21!';render();fx21();await sleep(800)}}

    if(p>capNow()){S.busy=true;S.msg='Estourou!';render();anim($('#pc'),'shake');await sleep(500);pvpSubmit();return}

  }
  if(p>21){S.busy=true;S.msg='Estourou!';render();anim($('#pc'),'shake');await sleep(500);S.hidden=false;render();await resolve();return}
  if(p===21||S.player.length>=5||S.doubled){await stand();return}

async function stand(){

async function resolve(){
  S.busy=true;S.hidden=false;
  const p=total(S.player),d=total(S.dealer);
  const pBJ=S.player.length===2&&p===21,dBJ=S.dealer.length===2&&d===21;

  if(p>21){type='bust';if(has('seguro')&&!S.seguroUsed){S.seguroUsed=true;type='push';render();pop(jokerEl(S.jokers.findIndex(j=>j.k==='seguro')),'Salvo!','info');await sleep(500)}}
  else if(pBJ&&!dBJ)type='bj';
  else if(dBJ&&!pBJ)type='lose';
  else if(S.player.length>=5)type='five';
  else if(d>21||p>d)type=p===21?'t21':'win';
  else if(p===d)type='push';
  else type='lose';
  if(type==='push'&&bossOn('espelho'))type='lose';
  const isWin=WIN_TYPES.includes(type);
  S.msg=type==='bust'?`Estourou com ${p}`:type==='lose'?(dBJ?'Blackjack do dealer':`Dealer ganhou: ${d} contra ${p}`):type==='push'?`Empate em ${p}`:type==='five'?'Cinco cartas! Vitória automática':d>21?`Dealer estourou com ${d}!`:type==='bj'?'Blackjack!':`Você ganhou: ${p} contra ${d}`;
  S.stats.hands++;
  if(isWin){S.stats.wins++;S.jokers.forEach((j,i)=>{if(j.k==='escalada'){j.v=(j.v||0)+1;setTimeout(()=>pop(jokerEl(i),'+1 Mult','mult'),50)}})}

  if(isWin&&has('agiota')){S.money++;pop(jokerEl(S.jokers.findIndex(j=>j.k==='agiota')),'+$1','gold');beep(990,.08)}
  S.handsLeft--;S.stats.best=Math.max(S.stats.best,pts);S.stats.total+=pts;
  render();await sleep(450);
  const duel=isDuel(),pvp=isPvp();

  if(S.handsLeft<=0){if(duel){duelFinished();return}if(S.mp){mpLifeLost();return}gameOver();return}
  S.busy=false;S.awaitNext=true;render();

}
async function scoreHand(type,ctx){

    S.calc={n:type==='bust'?'Estouro':'Derrota',c:0,m:0,lose:true,total:0};render();anim($('#calc'),'shake');beep(110,.3,'sawtooth',.05);await sleep(700);return 0}

      anim($(t==='c'?'#pc-c':'#pc-m'),'bump');beep(pitch+=60,.07,'triangle');await sleep(340)}
  }
  if(S.doubled){const k=has('dobradinha')?3:2;m*=k;S.calc.m=m;renderCalc();pop($('#calc'),`×${k} Dobrou`,'mult');anim($('#pc-m'),'bump');beep(pitch+=80,.1,'sawtooth');await sleep(380)}
  const tot=Math.floor(c*m);

  const from=S.roundScore,to=from+tot,steps=14;

function genShopItems(){
  /* No PvP a loja tem 3 cartas de ataque ou defesa. As cartas de mesa não se compram: a mesa sorteia uma a cada loja. */
  if(isPvp()){
    const pool=shuffle(Object.keys(JK).filter(k=>(JK[k].pvp==='atk'||JK[k].pvp==='def')&&!has(k)));
    const items=pool.slice(0,3).map(k=>({t:'j',k,sold:false}));
    return items;
  }
  const pool=shuffle(Object.keys(JK).filter(k=>!has(k)&&!JK[k].pvp));
  const hs=shuffle(Object.keys(HANDS));
  const items=[];
  pool.slice(0,2).forEach(k=>items.push({t:'j',k,sold:false}));
  hs.slice(0,2).forEach(k=>items.push({t:'p',k,sold:false}));
  return items;
}

/* ---------- Multiplayer: regras ---------- */
function mpLifeLost(){

function duelFinished(){

function resolveDuel(parts){
  S.mp.lastDuel=S.ante;
  parts.sort((a,b)=>b.s-a.s);
  const max=parts[0].s,min=parts[parts.length-1].s,mine=S.mp.dh[S.ante]||0;
  const contest=parts.length>1&&min<max;
  const iLose=contest&&mine===min, iWin=contest&&mine===max;
  if(iLose)S.mp.lives--;
  S.duelRes={parts,iLose,iWin,ante:S.ante,contest};
  S.phase='duelres';render();showDuelRes();
  beep(iLose?140:880,.25,iLose?'sawtooth':'square',.05);
}
function duelContinue(){
  const r=S.duelRes;
  if(S.mp.lives<=0){eliminate();return}

/* Desempate: se todos os que restam zeram a vida na mesma rodada, sobrevive quem ficou com a vida menos negativa

function tiebreak(me,round,rivals){
  if(rivals.some(p=>(+p.st.hk||0)<round))return 'wait';
  if(rivals.some(p=>(+p.st.hpr||0)>0))return 'die';
  const key=x=>[+x.hpr||0,+x.t||0,x.pid];
  const better=(a,b)=>{const x=key(a),y=key(b);for(let i=0;i<2;i++)if(x[i]!==y[i])return x[i]>y[i];return x[2]>y[2]};

}

function pvpCheckDamage(ps){
  if(!S.mp.recv)S.mp.recv={};

    if(!(v>old+0.001))continue;

    const sub=p.st.sub;
    if(act('esquiva')&&sub&&!sub.x&&(+sub.t||0)<=17)d=0;

    if(act('colete')&&mySub&&mySub.x&&d>0){d=0;S.mp.coleteR=S.round}

      const last=others.length&&others.every(x=>handVal(x.st.sub)>=handVal(mySub));
      if(last)d=Math.round(d*0.8);

    if(act('espelho')&&d>0&&S.mp.alive){const back=Math.round(d*0.2);if(back>0){S.mp.sent[p.pid]=r1((S.mp.sent[p.pid]||0)+back);reflected+=back}}
    blocked+=raw-d;
    if(d>0){S.mp.hp=r1(S.mp.hp-d);gained+=d;who.push(p.name)}

  }
  if(blocked>0.05&&S.mp.alive){pop($('#rack'),`Defesa: −${fmt(r1(blocked))} de dano`,'info');beep(700,.08,'triangle')}
  if(reflected>0.05&&S.mp.alive)setTimeout(()=>pop($('#rs'),`Espelho: ${fmt(r1(reflected))} de volta`,'info'),300);
  if(gained>0&&S.mp.alive){
    pop($('#blindBox'),`−${fmt(r1(gained))} PV · ${who.slice(0,2).join(', ')}${who.length>2?'…':''}`,'mult');
    anim($('#blindBox'),'shake');beep(130,.15,'sawtooth',.05);
    render();
    if(openSheet==='pvpres')showPvpResult();
  }

}

/* Cliente MQTT 3.1.1 mínimo sobre WebSocket: cada jogador publica seu estado (retido) num tópico da sala. */
const TE=new TextEncoder(),TD=new TextDecoder();

    ws.onopen=()=>{
      const cid='c21'+MP.pid.slice(0,8)+Math.random().toString(36).slice(2,8);
      const body=this.will?[...mStr('MQTT'),4,0x26,0,30,...mStr(cid),...mStr(this.will),0,0]:[...mStr('MQTT'),4,0x02,0,30,...mStr(cid)];
      ws.send(mPkt(0x10,body));
    };
    ws.onmessage=ev=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb;this._parse()};

  _retry(){if(this.closed)return;this.tries++;setTimeout(()=>this._open(),Math.min(10000,1500*this.tries))}

  _notify(){if(this.notifyT)return;this.notifyT=setTimeout(()=>{this.notifyT=null;for(const cb of this.cbs){try{cb()}catch(e){console.error(e)}}},60)}
  _bye(){this.closed=true;clearInterval(this.hb);try{if(this.ok)this.ws.send(new Uint8Array([0xE0,0]))}catch(e){}setTimeout(()=>{try{this.ws&&this.ws.close()}catch(e){}},300)}
}

/* Uma sala: cada jogador publica seu estado (retido) no tópico da sala. */
class Sala extends Mq{
  constructor(code,pid){const base='coringa21/v2/'+code+'/p/';super(base+pid);this.code=code;this.pid=pid;this.base=base;this.me={};this.map=new Map();this.pt=null;this.lastPub=0;this.lastAnn=''}
  _connected(){
    this.sub(this.base+'+');
    this._pubNow();
    clearInterval(this.hb);this.hb=setInterval(()=>this._pubNow(),15000);
  }
  _msg(topic,payload){
    if(!topic.startsWith(this.base))return;
    const pid=topic.slice(this.base.length);if(!/^[a-z0-9]{1,16}$/.test(pid))return;
    const now=Date.now();
    if(!payload.length||payload.length>8000){const e=this.map.get(pid);if(e){e.online=false;e.seen=Math.min(e.seen,now)}this._notify();return}
    let pr;try{pr=JSON.parse(TD.decode(payload))}catch(e){return}
    if(!pr||typeof pr!=='object')return;
    pr.pid=pid;
    const ts=Math.min(now,+pr.ts||now);
    if(now-ts>180000)return;
    this.map.set(pid,{pr,seen:ts,online:now-ts<50000});
    this._notify();
  }
  _pubNow(){
    if(!this.ok||!this.ws)return;
    this.lastPub=Date.now();
    const pr={...this.me,pid:this.pid,ts:this.lastPub};
    this.map.set(this.pid,{pr,seen:this.lastPub,online:true});
    this.pub(this.base+this.pid,JSON.stringify(pr),true);
    this.announce(true);
  }
  /* Quem entrou primeiro (e ainda está online) anuncia a sala na lista pública. */
  announce(force){
    if(!this.ok)return;
    const ps=this.peers().filter(p=>!p.off);
    if(!ps.length)return;
    const first=ps.slice().sort((a,b)=>(+a.presence.j||0)-(+b.presence.j||0)||(a.presence.pid<b.presence.pid?-1:1))[0];
    if(first.presence.pid!==this.pid)return;
    const lobby=ps.filter(p=>!p.presence.g).length;
    const fp=first.presence;const info={h:cleanName(this.me.name)||'Jogador',n:ps.length,s:lobby?'lobby':'jogo',m:fp.lm==='surv'?'surv':'pvp'};
    const key=JSON.stringify(info);
    if(!force&&key===this.lastAnn)return;
    this.lastAnn=key;
    this.pub(ROOMS_T+roomId(this.code),JSON.stringify({...info,ts:Date.now()}),true);
  }
  presence(patch){
    for(const k in patch){if(patch[k]===null)delete this.me[k];else this.me[k]=patch[k]}
    this.map.set(this.pid,{pr:{...this.me,pid:this.pid,ts:Date.now()},seen:Date.now(),online:true});
    const wait=Math.max(0,300-(Date.now()-this.lastPub));
    if(!this.pt)this.pt=setTimeout(()=>{this.pt=null;this._pubNow()},wait);
    this._notify();
    return Promise.resolve();
  }
  peers(){
    const now=Date.now(),out=[];
    for(const[pid,e]of this.map){
      const me=pid===this.pid;
      const online=me||(e.online&&now-e.seen<50000);
      if(!online&&now-e.seen>180000)continue;
      out.push({presence:e.pr,updatedAt:e.seen,isMe:me,sameTab:me,off:!online});
    }
    return out;
  }
  async leave(){
    const alone=this.peers().filter(p=>!p.off&&!p.isMe).length===0;
    if(this.ok){this.pub(this.base+this.pid,'',true);if(alone)this.pub(ROOMS_T+roomId(this.code),'',true)}
    this._bye();
  }
}

/* Vitrine: só escuta a lista pública de salas. */
class Vitrine extends Mq{
  constructor(){super(null);this.rooms=new Map()}
  _connected(){this.sub(ROOMS_T+'+')}
  _msg(topic,payload){
    if(!topic.startsWith(ROOMS_T))return;
    const id=topic.slice(ROOMS_T.length);if(!/^r[a-z0-9]{1,10}$/.test(id))return;
    if(!payload.length||payload.length>2000){this.rooms.delete(id);this._notify();return}
    let r;try{r=JSON.parse(TD.decode(payload))}catch(e){return}
    if(!r||typeof r!=='object')return;
    this.rooms.set(id,{id,h:cleanName(r.h)||'Jogador',n:Math.max(1,Math.min(99,+r.n||1)),s:r.s==='jogo'?'jogo':'lobby',m:r.m==='surv'?'surv':'pvp',ts:Math.min(Date.now(),+r.ts||0)});
    this._notify();
  }
  list(){const now=Date.now();return [...this.rooms.values()].filter(r=>now-r.ts<45000).sort((a,b)=>(a.s===b.s?0:a.s==='lobby'?-1:1)||b.ts-a.ts).slice(0,30)}
  stop(){this._bye()}
}
let VIT=null;
function startVitrine(){if(VIT||!ROOM)return;VIT=new Vitrine();VIT.onPeers(renderRoomList);VIT.start().catch(()=>{VIT=null;renderRoomList()})}
function stopVitrine(){if(VIT){VIT.stop();VIT=null}}
function renderRoomList(){
  const el=$('#roomlist');if(!el)return;
  if(!VIT){el.innerHTML='<p class="c-dim" style="text-align:center;font-size:13.5px">Não consegui carregar a lista agora. Você ainda pode entrar pelo código.</p>';return}
  if(!VIT.connected()){el.innerHTML='<p class="c-dim" style="text-align:center;font-size:13.5px">Procurando salas…</p>';return}
  const rs=VIT.list();
  el.innerHTML=rs.length?rs.map(r=>`<button class="li roombtn" data-act="pickroom" data-id="${r.id}" data-h="${esc(r.h)}" ${r.s==='jogo'?'disabled':''}><span class="dot" style="--pc:${r.s==='jogo'?'#5b6b7a':'#5fd38a'}"></span><span class="grow"><b>Sala de ${esc(r.h)}</b><br><small class="c-dim">${r.m==='pvp'?'PvP':'Sobrevivência'} · ${r.n} jogador${r.n===1?'':'es'} · ${r.s==='jogo'?'partida em andamento':'esperando jogadores'}</small></span><span class="c-gold" style="font-weight:800">${r.s==='jogo'?'':'Entrar ›'}</span></button>`).join(''):'<p class="c-dim" style="text-align:center;font-size:13.5px">Nenhuma sala aberta agora. Crie uma e chame os amigos.</p>';
}
setInterval(()=>{if(VIT&&openSheet==='mphome')renderRoomList();if(NR&&NR.announce)NR.announce(false)},5000);
setInterval(()=>{if(NR)onRoomChange()},5000);
const MP={code:null,pid:null,name:'',col:0,j:0,msg:'',started:new Set(),mesaOff:!!store.get('c21-mesaoff')};
MP.pid=store.get('c21-pid');if(typeof MP.pid!=='string'){MP.pid=rid();store.set('c21-pid',MP.pid)}
MP.name=store.get('c21-name')||'';
MP.mode=store.get('c21-mode')==='surv'?'surv':'pvp';
MP.col=Number.isInteger(store.get('c21-col'))?store.get('c21-col'):Math.floor(Math.random()*COLORS.length);
const colOf=i=>COLORS[Number.isInteger(i)&&i>=0&&i<COLORS.length?i:0];
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f​-‏‪-‮⁠-⁯]/g,'').trim().slice(0,14);

function roomPlayers(){
  const m=new Map();
  for(const p of (NR?NR.peers():[])){
    const pr=p.presence||{};if(typeof pr.pid!=='string'||pr.pid.length>16)continue;
    const me=pr.pid===MP.pid;
    const prev=m.get(pr.pid);
    if(!prev||(me?p.sameTab:p.updatedAt>prev.updatedAt))m.set(pr.pid,{pid:pr.pid,name:cleanName(pr.name)||'Jogador',col:pr.col,j:+pr.j||0,g:typeof pr.g==='string'?pr.g:null,start:pr.start,st:pr.st&&typeof pr.st==='object'?pr.st:null,lm:pr.lm==='surv'?'surv':'pvp',lhp:Math.max(0,Math.min(500,+pr.lhp||0)),lmo:!!pr.lmo,bot:!!pr.bot,me,off:!!p.off});
  }
  return [...m.values()];
}
const lobbyPlayers=()=>roomPlayers().filter(p=>!p.g&&!p.off).sort((a,b)=>a.j-b.j||(a.pid<b.pid?-1:1));
function gamePlayers(){if(!S||!S.mp)return[];return roomPlayers().filter(p=>p.g===S.mp.gid&&S.mp.players.includes(p.pid))}

let lastPres='';
function mpSync(){
  if(!NR||!S||!S.mp)return;
  const st={a:S.ante,b:S.bi,l:S.mp.lives,al:S.mp.alive?1:0,sc:S.roundScore,t:S.stats.total,ph:S.phase,dh:S.mp.dh,n:S.jokers.length};
  if(isPvp()){st.md='pvp';st.hp=pvpHP();st.hpr=r1(S.mp.hp!=null?S.mp.hp:pvpHP());st.hk=S.mp.hk||0;st.dm=S.mp.sent;st.r=S.round||0;st.sd=S.mp.sd||0;st.sub=S.mp.sub||null;st.ev=(S.mp.ev||[]).slice(-6);if(S.mp.rx)st.rx=S.mp.rx;delete st.dh;delete st.l;delete st.sc}
  const s=JSON.stringify(st);if(s===lastPres)return;lastPres=s;
  NR.presence({g:S.mp.gid,st}).catch(()=>{});
}
function mpTick(){
  if(!S||!S.mp)return;
  const ps=gamePlayers();
  if(isPvp()){
    pvpCheckDamage(ps);
    rxCheck(ps);
    if(S.phase==='pwait'&&S.mp.alive&&!S.busy&&S.mp.sub&&S.mp.sub.r===S.round&&!pvpWaitingNames().length){pvpShowdown();return}
    if(['play','pwait','pshow'].includes(S.phase)){renderActions();renderRivals()}
  }
  if(S.phase==='duelwait'&&S.mp.lastDuel<S.ante){
    const A=S.ante;
    const waiting=ps.filter(p=>!p.me&&p.st&&p.st.al&&!(Array.isArray(p.st.dh)&&p.st.dh[A]!=null));
    if(!waiting.length){
      const parts=ps.filter(p=>!p.me&&p.st&&Array.isArray(p.st.dh)&&p.st.dh[A]!=null).map(p=>({pid:p.pid,name:p.name,col:p.col,s:+p.st.dh[A]||0,me:false}));
      parts.push({pid:MP.pid,name:MP.name,col:MP.col,s:S.mp.dh[A]||0,me:true});
      resolveDuel(parts);return;
    }
  }
  if(S.mp.alive&&!S.busy&&!['done','won','out'].includes(S.phase)&&S.mp.players.length>1){
    const others=ps.filter(p=>!p.me);
    if(others.length&&others.every(p=>p.st&&!p.st.al))mpWin();
  }
}
function onRoomChange(){
  if(!S||!S.mp){
    const done=store.get('c21-done')||[];
    for(const p of roomPlayers()){const st=p.start;
      if(st&&typeof st==='object'&&typeof st.gid==='string'&&typeof st.seed==='string'&&Array.isArray(st.players)&&st.players.includes(MP.pid)&&!MP.started.has(st.gid)&&!done.includes(st.gid)){beginMP(st);return}}
  }
  if(S&&S.mp){mpTick();renderStrip();if(S.phase==='play'&&(isDuel()||isPvp())&&!S.busy)renderHUD()}
  if(openSheet==='lobby')showLobby();else if(openSheet==='board')showBoard();else if(openSheet==='duelwait')showDuelWait();
}
async function enterRoom(code){
  code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
  const nm=cleanName(($('#nick')||{}).value||MP.name);
  if(!nm){MP.msg='Escreva seu apelido primeiro.';showMPHome();return}
  if(!code){MP.msg='Digite o código da sala.';showMPHome();return}
  MP.name=nm;store.set('c21-name',nm);store.set('c21-col',MP.col);
  MP.msg='Entrando na sala…';showMPHome();
  const sala=new Sala(code,MP.pid);
  sala.presence({name:MP.name,col:MP.col,j:Date.now(),g:null,start:null,st:null,lm:MP.mode,lmo:MP.mesaOff?1:0});
  try{NR=await sala.start()}catch(e){NR=null;MP.msg='Não consegui conectar ao servidor de salas. Confira a internet e tente de novo.';showMPHome();return}
  MP.code=code;MP.j=NR.me.j;MP.msg='';lastPres='';stopVitrine();
  NR.onPeers(()=>onRoomChange());
  showLobby();
}
/* ---------- Bots do PvP ----------
   Quem cria a sala roda os bots no próprio aparelho e publica o estado deles na sala,
   como se fossem jogadores. Eles seguem as mesmas regras: fecham a mão, comparam e causam dano. */
const BOT_NAMES=['Ás','Valete','Dama','Rei','Curinga','Trinca','Naipe','Ficha','Banca'];
let BOTS=[];
function botPub(b){
  if(!NR)return;
  const pr={pid:b.pid,name:b.name,col:b.col,j:b.j,g:b.g||null,bot:1,st:b.st||null,ts:Date.now()};
  NR.map.set(b.pid,{pr,seen:pr.ts,online:true});NR.pub(NR.base+b.pid,JSON.stringify(pr),true);NR._notify();b.lastPub=pr.ts;
}
function addBot(){
  if(!NR)return;
  const lp=lobbyPlayers();if(lp.length>=MAXP)return;
  const used=new Set(lp.map(p=>p.name));const name=BOT_NAMES.find(n=>!used.has(n))||('Bot'+(BOTS.length+1));
  const usedC=new Set(lp.map(p=>p.col));let col=COLORS.findIndex((c,i)=>!usedC.has(i));if(col<0)col=BOTS.length%COLORS.length;
  const b={pid:'b'+rid().slice(0,7),name,col,j:Date.now()+BOTS.length,g:null,st:null};
  BOTS.push(b);botPub(b);beep(600,.05);
}
function removeBot(b){
  b=b||BOTS[BOTS.length-1];if(!b)return;
  BOTS=BOTS.filter(x=>x!==b);
  if(NR){NR.pub(NR.base+b.pid,'',true);NR.map.delete(b.pid);NR._notify()}
}
function clearBots(){while(BOTS.length)removeBot()}
function botStart(st){
  for(const b of BOTS){
    if(!st.players.includes(b.pid))continue;
    b.g=st.gid;b.players=st.players.slice();b.maxHp=(+st.hp>=40&&+st.hp<=500)?+st.hp:hpFor(st.players.length);b.r=1;b.sd=0;b.sent={};b.deck=[];
    /* bots também compram e usam cartas de ataque e defesa */
    b.hpv=b.maxHp;b.seen={};b.cards=[];b.money=4;b.bleed={};b.ult=0;b.coleteR=0;b.shR=0;b.shLeft=0;b.mesa=st.mesa!==0;b.ev=[];b.fx=[];
    b.nextAt=Date.now()+4000+Math.random()*4000;
    b.st={md:'pvp',al:1,hp:b.maxHp,dm:{},r:1,sd:0,sub:null,ph:'play',t:0,a:1,n:0,ev:[]};
    botPub(b);
  }
}
const bHas=(b,k)=>!!(b.cards&&b.cards.includes(k));
function botDeck(){const d=[];for(const s of SUITS)for(const r of RANKS)d.push({r,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function botTotal(c,iron){let t=0,a=0;for(const x of c){if(x.r==='A'){if(iron)t+=1;else{t+=11;a++}}else t+=baseVal(x)}while(t>21&&a){t-=10;a--}return t}
const bFx=(b,k)=>!!(b.fx&&b.fx.some(e=>e.k===k));
const bAct=(b,k)=>bHas(b,k)&&!(bFx(b,'silencio')&&JK[k]&&(JK[k].pvp==='atk'||JK[k].pvp==='def'));
/* Loja do bot: juros, depois compra cartas sorteadas que couberem no bolso (máximo 5). */
function botShop(b){
  b.money+=Math.min(2,Math.floor(b.money/10));
  const rnd=a=>a.sort(()=>Math.random()-.5);
  const offer=rnd(Object.keys(JK).filter(k=>(JK[k].pvp==='atk'||JK[k].pvp==='def')&&!bHas(b,k))).slice(0,3);
  for(const k of offer)if(b.cards.length<5&&JK[k].c<=b.money){b.money-=JK[k].c;b.cards.push(k)}
  b.st.n=b.cards.length;
}
function botFx(b,all,R){if(!b.mesa)return [];const k=mesaCardFor(b.g,R);return k?[{k}]:[]}
/* Defesa do bot: mesmas regras de pvpCheckDamage, aplicadas ao dano novo de cada rival. */
function botDefend(b,all){
  const st=b.st;let ch=false;
  const my=st.sub&&st.sub.r===b.r?st.sub:null;
  for(const p of all){
    if(!p.st||!p.st.dm||typeof p.st.dm!=='object')continue;
    const v=Math.min(100000,Math.max(0,+p.st.dm[b.pid]||0)),old=+b.seen[p.pid]||0;
    if(!(v>old+0.001))continue;
    b.seen[p.pid]=v;let d=Math.round(v-old);const sub=p.st.sub;
    if(bAct(b,'esquiva')&&sub&&!sub.x&&(+sub.t||0)<=17)d=0;
    if(bAct(b,'colete')&&my&&my.x&&d>0){d=0;b.coleteR=b.r}
    if(bAct(b,'armadura')&&d>0)d=Math.max(0,Math.round(d*0.85));
    if(bAct(b,'muralha')&&d>0&&my){const o=all.filter(x=>x.st&&x.st.sub&&x.st.sub.r===b.r);if(o.length&&o.every(x=>handVal(x.st.sub)>=handVal(my)))d=Math.round(d*0.8)}
    if(bAct(b,'escudo')&&d>0){if(b.shR!==b.r){b.shR=b.r;b.shLeft=2}const a=Math.min(b.shLeft,d);d-=a;b.shLeft-=a}
    if(bAct(b,'espelho')&&d>0&&st.al){const back=Math.round(d*0.2);if(back>0){b.sent[p.pid]=r1((b.sent[p.pid]||0)+back);st.dm={...b.sent};ch=true}}
    if(d>0)b.hpv=r1(b.hpv-d);
    if(b.hpv<=0&&bAct(b,'ultima')&&!b.ult){b.ult=1;b.hpv=1}
  }
  return ch;
}
function botTick(){
  if(!NR||!BOTS.length)return;
  const now=Date.now();
  for(const b of BOTS){
    if(now-(b.lastPub||0)>15000)botPub(b);
    if(!b.g||!b.st)continue;
    const st=b.st;if(!st.al||st.ph==='won')continue;
    const all=roomPlayers().filter(p=>p.g===b.g&&b.players.includes(p.pid)&&p.pid!==b.pid);
    let ch=botDefend(b,all);
    const hpr=r1(b.hpv);const hp=Math.max(0,Math.ceil(hpr));
    if(st.hpr!==hpr){st.hpr=hpr;ch=true}if(hp!==st.hp){st.hp=hp;ch=true}
    const others=all.filter(p=>p.st&&p.st.al);
    if(!st.sub||st.sub.r<b.r){
      if(now>=b.nextAt){
        if(b.deck.length<15)b.deck=botDeck();
        /* para no 17 e dobra com 10 ou 11 (como uma pessoa atenta); com Teto 19 para no 15 */
        const cap=bFx(b,'teto')?19:bFx(b,'ceu')?23:21,iron=bFx(b,'asferro'),mx=bFx(b,'curta')?3:5;
        const c=[b.deck.pop(),b.deck.pop()];let dbl=false;const t2=botTotal(c,iron);
        if(cap===21&&(t2===10||t2===11)){dbl=true;c.push(b.deck.pop())}
        else while(botTotal(c,iron)<cap-4&&c.length<mx)c.push(b.deck.pop());
        const t=botTotal(c,iron);
        st.sub={r:b.r,t:Math.min(t,99),c:c.map(cardStr),bj:c.length===2&&t===21&&cap>=21?1:0,f:c.length>=5&&t<=cap?1:0,x:t>cap?1:0};
        b.dbl=dbl;st.ph='pwait';ch=true;
      }
    }else if(b.sd<b.r){
      if(!others.some(p=>!(p.st.sub&&p.st.sub.r===b.r))){
        const parts=others.map(p=>({pid:p.pid,v:handVal(p.st.sub)}));
        const myV=handVal(st.sub);const beaten=myV<0?[]:parts.filter(p=>p.v<myV);
        const truce=b.fx.some(e=>e.k==='tregua');
        /* sangria de rodadas anteriores */
        for(const pid in b.bleed){const q=b.bleed[pid];if(b.r>q.from&&b.r<=q.to&&others.some(p=>p.pid===pid))b.sent[pid]=r1((b.sent[pid]||0)+(truce?1:2));if(b.r>=q.to)delete b.bleed[pid]}
        if(beaten.length){
          const s2=st.sub,cards=s2.c.length,t=s2.t;
          const type=s2.bj?'bj':s2.f?'five':t===21?'t21':'win';
          const chips=HANDS[type].c+s2.c.reduce((a,x)=>{const r=String(x).replace(/[♠♥♦♣]/g,'');return a+(r==='A'&&bFx(b,'asferro')?1:baseVal({r}))},0);
          const pts=chips*HANDS[type].m*(b.dbl?2:1);
          const dmg=Math.round(pts/ANTE_BASE[0]*DMG_K*(1+0.05*Math.min(10,b.r-1)));
          let per=Math.max(1,Math.round(dmg/Math.max(1,parts.length)),pvpMinHit(b.r));
          if(t===21&&bAct(b,'critico'))per=Math.round(per*1.5);
          if(bAct(b,'furia')&&b.hpv<40)per=per*2;
          if(bAct(b,'duplo')&&beaten.length>=2)per=Math.round(per*1.5);
          if(bAct(b,'lamina'))per+=3;
          if(bAct(b,'cinco'))per+=2*(cards-1);
          if(bAct(b,'precisao')&&t===20)per+=7;
          if(truce)per=Math.max(1,Math.round(per/2));
          for(const x of beaten)b.sent[x.pid]=r1((b.sent[x.pid]||0)+per);
          if(bAct(b,'sangria'))for(const x of beaten)b.bleed[x.pid]={from:b.r,to:b.r+3};
          if(bAct(b,'vampiro'))b.hpv=r1(Math.min(b.maxHp,b.hpv+Math.max(1,Math.round(per*beaten.length*0.15))));
          st.t=(st.t||0)+pts;
        }
        b.money+=(beaten.length?(beaten.length===parts.length?2:1):0)*(bFx(b,'ouro')?2:1);
        if(bFx(b,'empate')&&myV>=0&&parts.some(p=>p.v===myV))b.hpv=r1(b.hpv-5);
        st.dm={...b.sent};
        if(Math.random()<.3){const e=st.sub.x?(Math.random()<.5?2:7):beaten.length===parts.length&&parts.length?(Math.random()<.5?5:4):!beaten.length?1:0;st.rx={e,t:Date.now()+800}}
        b.sd=b.r;st.sd=b.r;st.ph='pshow';ch=true;
      }
    }else{
      if(others.every(p=>(+p.st.sd||0)>=b.r)){
        if((st.hk||0)<b.r){st.hk=b.r;ch=true}
        let go=true;
        if(hpr<=0){
          const r=others.length?tiebreak({hpr,t:st.t||0,pid:b.pid},b.r,others):'live';
          if(r==='wait')go=false;
          else if(r==='die'){st.al=0;st.ph='out';go=false;ch=true}
          else{b.hpv=1;st.hpr=1;st.hp=1}
        }
        if(go){
          if(b.coleteR&&b.coleteR<=b.r){b.cards=b.cards.filter(k=>k!=='colete');b.coleteR=0;st.n=b.cards.length}
          if(b.r%PVP_SHOP_EVERY===0)botShop(b);
          if(bAct(b,'bandagem')&&b.hpv<b.maxHp/2)b.hpv=r1(Math.min(b.maxHp,b.hpv+3));
          b.r++;st.r=b.r;st.a=1+Math.floor((b.r-1)/(PVP_SHOP_EVERY*2));st.ph='play';b.nextAt=now+1500+Math.random()*3500;ch=true;
          b.fx=botFx(b,all,b.r);
          if(bFx(b,'hospital'))b.hpv=r1(Math.min(b.maxHp,b.hpv+4));
          if(bFx(b,'tempestade'))b.hpv=r1(b.hpv-5)}
      }
    }
    if(st.al&&all.length&&all.every(p=>p.st&&!p.st.al)){st.ph='won';ch=true}
    if(ch)botPub(b);
  }
}

function cmpRank(a,b){const x=rankKey(a),y=rankKey(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return y[i]-x[i];return 0}

document.addEventListener('click',e=>{
  const card=e.target.closest('#pc .card');
  if(card&&S&&S.phase==='play'&&!S.busy&&!S.awaitNext&&!S.doubled){const id=+card.dataset.cid;S.sel=S.sel===id?null:id;beep(700,.03);render();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,i=+t.dataset.i;
  if(t.disabled)return;
  switch(act){
    case 'new':newRun(String(Date.now()+Math.random()),'');break;
    case 'daily':{const d=new Date();newRun('dia-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),'Desafio do dia '+todayStr());break}
    case 'continue':{const sv=store.get(SAVE);if(sv){S=sv.S;R.s=sv.rs;R2.s=Number.isInteger(sv.rs2)?sv.rs2:trueSeed();S.busy=false;S.mp=null;resume()}break}
    case 'how':showHow('home');break;
    case 'cardsh':cardsBack='home';showCards(S&&isPvp()?'pvp':'pvp');break;
    case 'cardsm':cardsBack='menu';showCards(S&&isPvp()?'pvp':'solo');break;
    case 'cards':showCards(t.dataset.t);break;
    case 'howm':showHow('menu');break;
    case 'home':if(S&&S.mp){showBoard();break}stopVitrine();S=null;render0();showStart();break;
    case 'winhome':store.del(SAVE);S=null;render0();showStart();break;
    case 'mute':muted=!muted;store.set('coringa21-mute',muted);showStart();break;
    case 'mutem':muted=!muted;store.set('coringa21-mute',muted);showMenu();break;
    case 'mphome':MP.msg='';if(NR&&MP.code)showLobby();else showMPHome();break;
    case 'color':MP.col=i;store.set('c21-col',i);showMPHome();break;
    case 'create':{const a='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let k=0;k<4;k++)c+=a[Math.floor(Math.random()*a.length)];enterRoom(c);break}
    case 'join':enterRoom(($('#codein')||{}).value);break;
    case 'pickroom':MP.msg='';{const nk=$('#nick');if(nk&&cleanName(nk.value)){MP.name=cleanName(nk.value);store.set('c21-name',MP.name)}}showJoinPrompt(t.dataset.id,t.dataset.h||'');break;
    case 'joinpick':tryJoinPick(t.dataset.id,t.dataset.h||'');break;
    case 'mphomeback':MP.msg='';showMPHome();break;
    case 'startgame':startGame();break;
    case 'pvpgo':pvpStartRound();break;
    case 'pvpnext':pvpNext();break;
    case 'pvpres':showPvpResult();break;
    case 'mode':MP.mode=t.dataset.m==='surv'?'surv':'pvp';store.set('c21-mode',MP.mode);if(MP.mode!=='pvp')clearBots();if(NR)NR.presence({lm:MP.mode});showLobby();break;
    case 'addbot':addBot();showLobby();break;
    case 'hpup':setLobbyHP(20);showLobby();break;
    case 'mesatoggle':MP.mesaOff=!MP.mesaOff;store.set('c21-mesaoff',MP.mesaOff);if(NR)NR.presence({lmo:MP.mesaOff?1:0});showLobby();break;
    case 'hpdown':setLobbyHP(-20);showLobby();break;
    case 'rmbot':removeBot();showLobby();break;
    case 'copycode':shareInvite(t);break;
    case 'gameinvite':shareGameInvite(t);break;
    case 'leaveroom':leaveRoom();break;
    case 'lobby':backToLobby();break;
    case 'mpresume':{const sv=store.get(SAVE_MP);if(sv&&sv.S&&sv.S.mp){MP.started.add(sv.S.mp.gid);S=sv.S;R.s=sv.rs;R2.s=Number.isInteger(sv.rs2)?sv.rs2:trueSeed();S.busy=false;lastPres='';resume()}break}
    case 'play':startBlind();break;
    case 'hit':if(!S.busy)hit();break;
    case 'stand':if(!S.busy)stand();break;
    case 'double':if(!S.busy)doDouble();break;
    case 'swap':if(!S.busy)swap();break;
    case 'next':deal();break;
    case 'hands':showHands();break;
    case 'board':if(S&&S.mp)showBoard();break;
    case 'close':resumeSheet();break;
    case 'collect':collect();break;
    case 'shopitem':showBuy(i);break;
    case 'buyok':buy(i);break;
    case 'reroll':if(S.money>=S.shop.reroll){S.money-=S.shop.reroll;S.shop.reroll++;const ps=S.shop.items.filter(x=>x.t==='p');S.shop.items=isPvp()?genShopItems():genShopItems().filter(x=>x.t==='j').concat(ps);beep(500,.06);render();showShop()}break;
    case 'leave':leaveShop();break;
    case 'toshopfresh':openShop();break;
    case 'joker':if(S)showJoker(i);break;
    case 'usemesa':if(S)useMesa(i);break;
    case 'toshop':showShop();break;
    case 'sell':{const j=S.jokers[i];if(!j)break;S.money+=sellPrice(j.k);S.jokers.splice(i,1);beep(300,.08);render();if(S.phase==='shop')showShop();else resumeSheet();break}
    case 'mvl':case 'mvr':{const k=act==='mvl'?i-1:i+1;[S.jokers[i],S.jokers[k]]=[S.jokers[k],S.jokers[i]];render();showJoker(k);break}
    case 'rxopen':rxToggle();break;
    case 'rx':rxSend(+t.dataset.i);break;
    case 'menu':if(S&&(S.phase==='play'||S.phase==='pwait')&&!S.busy)showMenu();else if(S&&S.phase!=='play')resumeSheet();else if(!S)showStart();break;
    case 'quit':showQuit();break;
    case 'quitok':if(S.mp)eliminate();else gameOver();break;
    case 'endless':S.endless=true;openShop();break;
    case 'duelnext':duelContinue();break;
    case 'copy':copyText(resultText(),t);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='codein'){if(e.target.dataset.room)tryJoinPick(e.target.dataset.room,e.target.dataset.h||'');else enterRoom(e.target.value)}});
function buy(i){
  const it=S.shop.items[i];if(!it||it.sold)return;
  if(it.t==='j'){const c=JK[it.k].c;if(S.money<c||S.jokers.length>=5)return;S.money-=c;S.jokers.push({k:it.k,v:0})}
  else{if(S.money<3)return;S.money-=3;S.levels[it.k]++}
  it.sold=true;beep(880,.08);setTimeout(()=>beep(1180,.1),90);render();showShop();
}
const SITE_URL='https://mayconsilvaseguranca-eng.github.io/coringa21/';

function shareGameInvite(btn){

function copyText(txt,btn){
  const ok=()=>{btn.textContent='Copiado!'};
  const fallback=()=>{const p=$('#share');if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Texto selecionado'}else btn.textContent=txt};
  try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(e){fallback()}
}
function resumeSheet(){
  if(!S){showStart();return}
  const ph=S.phase;
  if(ph==='play'||ph==='pwait'){hideSheet();return}
  if(ph==='select')showSelect();else if(ph==='shop')showShop();else if(ph==='cash')showCash();else if(ph==='over')showOver();
  else if(ph==='won')(S.mp?showBoard:showWon)();else if(ph==='duelwait')showDuelWait();else if(ph==='duelres')showDuelRes();
  else if(ph==='pshow')showPvpResult();else if(ph==='pwait')hideSheet();
  else if(ph==='lifelost')showLifeLost();else if(ph==='out'||ph==='done')showBoard();else hideSheet();
}
function resume(){
  hideSheet();
  if(isPvp()){
    if(S.phase==='play'){if(!S.player.length||total(S.player)>21){S.round=Math.max(0,(S.round||1)-1);pvpStartRound();return}S.deadline=Date.now()+PVP_TURN_MS;render();return}
    if(S.phase==='pwait'){render();mpTick();return}
    if(S.phase==='pshow'){if(S.pv){render();showPvpResult()}else{S.phase='pwait';render();mpTick()}return}
  }
  if(S.phase==='play'){
    if(!S.player.length||(!S.awaitNext&&total(S.player)>21)){render();deal();return}
    render();return}
  render();resumeSheet();
  if(S.mp)mpTick();
}

/* ---------- Fundo animado ---------- */
(function(){
  const cv=$('#bg'),ctx=cv.getContext('2d');const W=72,H=128;cv.width=W;cv.height=H;
  const img=ctx.createImageData(W,H);
  const A=[9,38,33],B=[22,92,76],C=[10,26,42],D=[60,24,40];
  function frame(t){
    t/=1000;const d=img.data;let p=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const u=x/W-.5,v=(y/H-.5)*1.7,r=Math.hypot(u,v),a=Math.atan2(v,u);
      let s=Math.sin(a*3+r*11-t*.5+Math.sin(r*7-t*.35)*1.6)+Math.sin(u*5+t*.2)*.4;
      s=Math.round(s*3)/3;
      let c1=s>0?B:C,k=Math.min(1,Math.abs(s)/1.4);
      if(s>1.2){c1=D;k=.5}
      d[p++]=A[0]+(c1[0]-A[0])*k;d[p++]=A[1]+(c1[1]-A[1])*k;d[p++]=A[2]+(c1[2]-A[2])*k;d[p++]=255}
    ctx.putImageData(img,0,0);
  }
  if(RM){frame(4000);return}
  let last=0;(function loop(ts){if(ts-last>60){frame(ts);last=ts}requestAnimationFrame(loop)})(0);
})();
